name: Deploy ANS landscape

on:
  push:
    branches:
      - main
    paths:
      - "landscape/**"
      - ".github/workflows/deploy-landscape.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LANDSCAPE2_IMAGE: ghcr.io/cncf/landscape2:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pull landscape2 image
        run: docker pull "$LANDSCAPE2_IMAGE"

      # The landscape2 image runs as a non-root user by default. Running the
      # whole job inside it (via the job-level `container:` key) makes GitHub
      # Actions execute checkout/upload-pages-artifact as that non-root user
      # too, which fails with EACCES writing to the runner's _temp directory.
      # Instead we stay on the normal runner and only use the image for the
      # actual CLI invocations, run as root (--user root) so it can always
      # write into the bind-mounted workspace regardless of its owning uid.
      # GitHub-hosted runners don't use Docker userns-remap, so container
      # root maps straight to host root here; output files keep the default
      # world-readable permissions so the later upload step (non-root) can
      # still read them.
      # Run with the working directory set to landscape/ (not the repo root) so
      # that relative paths in settings.yml (e.g. header.logo: "logos/ans.png",
      # resolved by landscape2 against its own CWD, not against settings.yml's
      # location) match exactly what the README's local build instructions use.
      - name: Validate landscape data sources
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}:/workspace" -w /workspace/landscape \
            "$LANDSCAPE2_IMAGE" sh -c '
              landscape2 validate data --data-file data.yml &&
              landscape2 validate settings --settings-file settings.yml &&
              landscape2 validate guide --guide-file guide.yml
            '

      - name: Build landscape website
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}:/workspace" -w /workspace/landscape \
            "$LANDSCAPE2_IMAGE" landscape2 build \
              --data-file data.yml \
              --settings-file settings.yml \
              --guide-file guide.yml \
              --logos-path logos \
              --output-dir build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landscape/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
