name: Deploy ANS landscape

# Builds its own landscape2 image from this repo's source (crates/cli +
# ui/webapp) instead of depending on .github/workflows/build-images.yml or
# pulling the upstream ghcr.io/cncf/landscape2 image. Both alternatives were
# tried and rejected:
#   - ghcr.io/cncf/landscape2 doesn't contain our ui/webapp customizations
#     (e.g. the tool name + status color shown on grid tiles).
#   - build-images.yml (and ci.yml) use `runs-on: labels: ubuntu-latest-8-cores`,
#     a custom runner label with no runner actually available in this repo —
#     every run against it sits queued forever or gets cancelled, so it can
#     never produce a fresh image. Depending on it (via workflow_run) meant
#     deploys silently stopped happening.
# Building here on plain `ubuntu-latest` (proven to work — this workflow's
# own past runs succeeded on it) is slower per run than an 8-core runner
# would be, but it's the only path that's actually confirmed to execute.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LANDSCAPE2_IMAGE: landscape2-local:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build landscape2 image from source
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/cli/Dockerfile
          tags: ${{ env.LANDSCAPE2_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The landscape2 image runs as a non-root user by default; running the
      # whole job inside it (via the job-level `container:` key) makes GitHub
      # Actions execute checkout/upload-pages-artifact as that non-root user
      # too, which fails with EACCES writing to the runner's _temp directory.
      # Instead we stay on the normal runner and only use the image for the
      # actual CLI invocations, run as root (--user root) so it can always
      # write into the bind-mounted workspace regardless of its owning uid.
      # GitHub-hosted runners don't use Docker userns-remap, so container
      # root maps straight to host root here; output files keep the default
      # world-readable permissions so the later upload step (non-root) can
      # still read them.
      # Run with the working directory set to landscape/ (not the repo root) so
      # that relative paths in settings.yml (e.g. header.logo: "logos/ans.png",
      # resolved by landscape2 against its own CWD, not against settings.yml's
      # location) match exactly what the README's local build instructions use.
      - name: Validate landscape data sources
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}:/workspace" -w /workspace/landscape \
            "$LANDSCAPE2_IMAGE" sh -c '
              landscape2 validate data --data-file data.yml &&
              landscape2 validate settings --settings-file settings.yml &&
              landscape2 validate guide --guide-file guide.yml
            '

      - name: Build landscape website
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}:/workspace" -w /workspace/landscape \
            "$LANDSCAPE2_IMAGE" landscape2 build \
              --data-file data.yml \
              --settings-file settings.yml \
              --guide-file guide.yml \
              --logos-path logos \
              --output-dir build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: landscape/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
