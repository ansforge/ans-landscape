# Landscape des outils ANS
#
# Ce fichier décrit les catégories, sous-catégories et outils affichés dans le
# landscape. Voir landscape/README.md pour le guide d'édition complet, et
# https://github.com/cncf/landscape2/blob/main/docs/config/data.yml pour la
# référence exhaustive du format.
#
# Chaque sous-catégorie ne doit pas dépasser 5 outils (1 à 5 choix max).
#
# Les outils listés ci-dessous sont des exemples de valeurs à titre
# d'illustration (principaux outils du marché, choisis pour montrer le
# fonctionnement des statuts recommande/alternative/deprecie) — ils ne
# reflètent pas nécessairement les choix réels/officiels de l'ANS. À ajuster
# selon les décisions effectives de l'agence.

categories:
