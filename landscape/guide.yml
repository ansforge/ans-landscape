# Guide du landscape ANS
#
# Ce contenu alimente la page /guide du site généré. Il complète la grille
# en expliquant, catégorie par catégorie, ce qu'elle couvre et comment
# choisir entre les outils proposés.
#
# Référence : https://github.com/cncf/landscape2/blob/main/docs/config/guide.yml

categories:
  - category: "Gestion de projet & Collaboration"
    content: |
      Outils pour piloter des projets, partager de la documentation,
      communiquer en équipe et concevoir des schémas. À utiliser dès qu'un
      besoin de suivi de tâches, de base de connaissances ou d'échange
      d'équipe se présente, avant d'improviser une solution ad hoc.

  - category: "Développement logiciel"
    content: |
      Outils du cycle de développement : gestion de code source, IDE,
      intégration/déploiement continu, gestion des paquets et analyse de
      qualité/sécurité du code. Référez-vous à cette catégorie pour
      standardiser la chaîne d'outils d'une équipe de développement.

  - category: "DevOps & Infrastructure"
    content: |
      Outils d'hébergement, de conteneurisation, d'infrastructure as code,
      de supervision et de gestion des logs. Utile pour toute équipe qui
      déploie et exploite des services en production.

  - category: "Intelligence Artificielle"
    content: |
      Assistants et copilotes IA, modèles de langage et plateformes MLOps /
      data science. Cette catégorie évolue vite : vérifiez la date de mise à
      jour des recommandations avant de vous engager sur un choix durable.

  - category: "Données & Analytique"
    content: |
      Bases de données, outils d'intégration/ETL et de reporting/BI.
      Point de départ pour tout projet nécessitant de stocker, transformer
      ou restituer des données.

  - category: "APIs & Interopérabilité"
    content: |
      Outils de conception, documentation, test et gestion du cycle de vie
      des API. À consulter dès qu'un projet expose ou consomme des API,
      en interne comme avec des partenaires externes.

  - category: "Sécurité & Identité"
    content: |
      Gestion des identités et des accès (IAM), des secrets, des
      vulnérabilités, conformité RGPD, PKI/chiffrement, détection et réponse
      (EDR/SIEM), pare-feu applicatif et gestion des incidents (CERT). À
      consulter systématiquement dès qu'un projet manipule des identifiants,
      des secrets ou expose un service.

  - category: "Support & Exploitation (ITSM)"
    content: |
      Outils de ticketing/helpdesk et de gestion des configurations (CMDB)
      pour le support aux utilisateurs et le suivi du parc applicatif.

  - category: "Ressources Humaines"
    content: |
      Outils de recrutement, d'administration RH, d'engagement des équipes
      et de gestion des espaces de travail. Point d'entrée pour toute
      solution touchant au cycle de vie des collaborateurs.

  - category: "Finance & Comptabilité"
    content: |
      Notes de frais, déplacements, ERP et gestion comptable/financière.
      À consulter pour tout besoin de suivi budgétaire ou de gestion du
      patrimoine.

  - category: "Gestion documentaire & Signature électronique"
    content: |
      Signature électronique, archivage électronique (SAE) et gestion
      électronique de documents (GED). À utiliser dès qu'un processus
      nécessite de faire signer, tracer ou conserver durablement un document.

  - category: "Formation & e-learning"
    content: |
      Plateformes de formation, création de modules e-learning et animation
      de sessions. Point de départ pour tout projet de montée en compétence
      ou de sensibilisation des agents.

  - category: "Relation client & CRM"
    content: |
      Outils de gestion de la relation client et d'automatisation des
      processus commerciaux ou de suivi des contacts.

  - category: "Communication, Marketing & Enquêtes"
    content: |
      Création de contenu, emailing, sondages/enquêtes et gestion
      d'événements. À consulter pour toute action de communication interne
      ou externe.

  - category: "Santé numérique — Applications internes ANS"
    content: |
      Applications développées ou opérées par l'ANS autour de l'identité
      numérique en santé (Pro Santé Connect, e-CPS) et de l'aide à la
      décision clinique. Ces outils sont spécifiques à l'agence et n'ont
      généralement pas d'alternative de marché équivalente.

  - category: "Poste de travail & Bureautique"
    content: |
      Outils bureautiques du quotidien et assistance à distance pour les
      utilisateurs finaux.
